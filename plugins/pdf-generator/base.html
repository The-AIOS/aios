<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Figtree:wght@400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  @page {
    size: A4;
    margin: 0;
  }

  body {
    font-family: 'Figtree', -apple-system, sans-serif;
    color: #1a1a2e;
    background: #f8f9fa;
    font-size: 10pt;
    line-height: 1.5;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* ── Page container ── */
  .page {
    width: 210mm;
    height: 297mm;
    padding: 16mm 22mm 22mm 22mm;
    page-break-after: always;
    position: relative;
    overflow: hidden;
  }
  .page:last-child { page-break-after: avoid; }

  /* ── Hero / Header ── */
  .hero {
    display: flex;
    align-items: center;
    gap: 10pt;
    margin-bottom: 4pt;
  }
  .hero-logo {
    width: 36pt;
    height: 36pt;
    flex-shrink: 0;
  }
  .hero-text h1 {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 20pt;
    font-weight: 800;
    color: #0a0915;
    letter-spacing: -0.5pt;
    line-height: 1.1;
  }
  .hero-text .tagline {
    font-size: 9pt;
    font-weight: 600;
    color: #0099ff;
    margin-top: 1pt;
  }

  /* ── Traction / Stats bar ── */
  .traction-bar {
    display: flex;
    gap: 0;
    margin: 5pt 0;
    background: #0a0915;
    border-radius: 8px;
    overflow: hidden;
  }
  .traction-item {
    flex: 1;
    padding: 5pt 6pt;
    text-align: center;
    border-right: 1px solid #1a1728;
  }
  .traction-item:last-child { border-right: none; }
  .traction-item .t-value {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 14pt;
    font-weight: 800;
    color: #fff;
    line-height: 1.1;
  }
  .traction-item .t-label {
    font-size: 5.5pt;
    color: rgba(255,255,255,0.6);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.2pt;
    margin-top: 1pt;
    white-space: nowrap;
  }

  /* ── Dividers ── */
  .divider {
    height: 3px;
    background: linear-gradient(90deg, #0099ff, #8b5cf6, #f97316, #22c55e);
    border: none;
    margin: 5pt 0;
    border-radius: 2px;
  }
  .divider-thin {
    height: 1px;
    background: #e5e7eb;
    border: none;
    margin: 4pt 0;
  }

  /* ── Typography ── */
  h2 {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 11pt;
    font-weight: 700;
    color: #0a0915;
    margin-bottom: 3pt;
    margin-top: 6pt;
  }
  h2 .accent { color: #0099ff; }

  h3 {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 9pt;
    font-weight: 700;
    color: #0a0915;
    margin: 4pt 0 2pt 0;
  }

  p {
    margin-bottom: 3pt;
    color: #374151;
    font-size: 8.5pt;
  }

  .label {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 7pt;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5pt;
  }

  /* ── Info box (left accent) ── */
  .info-box {
    border: 1px solid #e5e7eb;
    border-left: 3px solid #0099ff;
    border-radius: 8px;
    padding: 8pt 10pt;
    margin: 4pt 0;
    font-size: 8pt;
    line-height: 1.5;
    color: #1a1a2e;
  }
  .info-box.accent-orange { border-left-color: #f97316; }
  .info-box.accent-green { border-left-color: #22c55e; }

  /* ── Info box filled (blue bg, white text) ── */
  .info-box-filled {
    background: linear-gradient(135deg, #0099ff, #2060df);
    border-radius: 8px;
    padding: 8pt 12pt;
    margin: 4pt 0;
    font-size: 8pt;
    line-height: 1.5;
    color: #fff;
  }
  .info-box-filled strong { color: #fff; }

  /* ── Grids ── */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6pt; margin: 4pt 0; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5pt; margin: 4pt 0; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5pt; margin: 4pt 0; }

  /* ── Cards ── */
  .card {
    background: #f8fafc;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    padding: 6pt 8pt;
  }
  .card-accent {
    border-radius: 8px;
    padding: 6pt 8pt;
    border-left: 3px solid;
    background: #f8fafc;
  }
  .card-accent.blue { border-color: #3b82f6; }
  .card-accent.green { border-color: #22c55e; }
  .card-accent.purple { border-color: #a855f7; }
  .card-accent.orange { border-color: #f97316; }

  .card .title, .card-accent .title {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 8pt;
    font-weight: 700;
    margin-bottom: 1pt;
  }
  .card-accent.blue .title { color: #3b82f6; }
  .card-accent.green .title { color: #22c55e; }
  .card-accent.purple .title { color: #a855f7; }
  .card-accent.orange .title { color: #f97316; }

  .card .desc, .card-accent .desc {
    font-size: 7pt;
    color: #555;
    line-height: 1.3;
  }

  /* ── Metric card ── */
  .metric-card {
    text-align: center;
    padding: 6pt 5pt;
    background: #f8fafc;
    border-radius: 6px;
    border: 1px solid #e5e7eb;
  }
  .metric-card .value {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 14pt;
    font-weight: 800;
    color: #0099ff;
    line-height: 1.1;
  }
  .metric-card .label {
    font-size: 6.5pt;
    font-weight: 600;
    color: #374151;
    line-height: 1.25;
    margin-top: 2pt;
  }

  /* ── Problem / Solution ── */
  .ps-col {
    border-radius: 8px;
    padding: 6pt 8pt;
    font-size: 8pt;
  }
  .ps-col.problem { background: #fef2f2; border: 1px solid #fca5a5; }
  .ps-col.solution { background: #f0fdf4; border: 1px solid #86efac; }
  .ps-col .ps-label {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 7.5pt;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5pt;
    margin-bottom: 3pt;
  }
  .ps-col.problem .ps-label { color: #b91c1c; }
  .ps-col.solution .ps-label { color: #15803d; }
  .ps-col ul { list-style: none; padding: 0; }
  .ps-col li {
    padding: 1pt 0 1pt 10pt;
    position: relative;
    color: #374151;
    line-height: 1.35;
    font-size: 7.5pt;
  }
  .ps-col.problem li::before { content: "\2715"; position: absolute; left: 0; color: #ef4444; font-weight: 700; font-size: 7pt; }
  .ps-col.solution li::before { content: "\2192"; position: absolute; left: 0; color: #22c55e; font-weight: 600; }

  /* ── Table (pricing style) ── */
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 7.5pt;
    line-height: 1.35;
    margin: 2pt 0;
  }
  table th {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 600;
    font-size: 6.5pt;
    color: #6b7280;
    text-align: left;
    padding: 4pt 6pt;
    border-bottom: 1px solid #e5e7eb;
    text-transform: uppercase;
    letter-spacing: 0.3pt;
  }
  table td {
    padding: 5pt 6pt;
    border-bottom: 1px solid #f0f0f0;
    vertical-align: top;
    color: #374151;
  }
  table .col-name {
    font-weight: 700;
    color: #0a0915;
    font-size: 8pt;
  }
  table .col-status {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 600;
    font-size: 7.5pt;
    color: #0ea5e9;
    text-transform: uppercase;
    letter-spacing: 0.2pt;
  }
  table .col-price {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 700;
    font-size: 9pt;
    color: #0a0915;
  }
  table .col-muted {
    color: #9ca3af;
    text-align: right;
    font-size: 7.5pt;
  }

  /* ── Total box ── */
  .total-bar {
    background: #0a0915;
    border-radius: 8px;
    padding: 8pt 14pt;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 4pt 0;
  }
  .total-bar .total-label {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 7pt;
    font-weight: 600;
    color: rgba(255,255,255,0.7);
    text-transform: uppercase;
    letter-spacing: 0.3pt;
  }
  .total-bar .total-amount {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 16pt;
    font-weight: 800;
    color: #fff;
    text-align: right;
    line-height: 1.15;
  }
  .total-bar .total-sub {
    font-size: 8pt;
    color: rgba(255,255,255,0.5);
    text-align: right;
  }

  /* ── Timeline / Phases ── */
  .phases {
    display: flex;
    gap: 0;
    background: #f8fafc;
    border-radius: 8px;
    border: 1px solid #e5e7eb;
    overflow: hidden;
    margin: 6pt 0;
  }
  .phase {
    flex: 1;
    text-align: center;
    padding: 6pt 6pt;
  }
  .phase + .phase { border-left: 1px solid #e5e7eb; }
  .phase .p-num {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 16pt;
    font-weight: 800;
    color: #0099ff;
    line-height: 1.15;
  }
  .phase .p-name {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 7pt;
    font-weight: 700;
    color: #0a0915;
    margin: 1pt 0;
  }
  .phase .p-desc {
    font-size: 6pt;
    color: #6b7280;
    line-height: 1.25;
  }
  .phase .p-time {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 6.5pt;
    font-weight: 600;
    color: #0099ff;
    margin-top: 2pt;
  }

  /* ── CTA bar ── */
  .cta-bar {
    background: #0a0915;
    border-radius: 8px;
    padding: 8pt 14pt;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 5pt;
  }
  .cta-bar .cta-text {
    color: #fff;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 9pt;
    font-weight: 700;
  }
  .cta-bar .cta-sub {
    color: rgba(255,255,255,0.6);
    font-size: 7pt;
    margin-top: 1pt;
  }
  .cta-bar .cta-link {
    color: #0099ff;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 11pt;
    font-weight: 700;
    text-decoration: none;
  }

  /* ── CTA bar (blue variant) ── */
  .cta-bar.blue {
    background: #0099ff;
  }
  .cta-bar.blue .cta-text { color: #fff; }
  .cta-bar.blue .cta-sub { color: rgba(255,255,255,0.8); }
  .cta-bar.blue .cta-link { color: #fff; }

  /* ── CTA bar (light variant — preferred for proposals) ── */
  .cta-bar.light {
    background: #f0f1f3;
    border: 1px solid #e5e7eb;
  }
  .cta-bar.light .cta-text { color: #0a0915; }
  .cta-bar.light .cta-sub { color: #6b7280; }
  .cta-bar.light .cta-link { color: #0099ff; }

  /* ── Footer (flows with content, not absolute) ── */
  .footer {
    font-size: 6.5pt;
    color: #9ca3af;
    border-top: 1px solid #e5e7eb;
    padding-top: 5pt;
    margin-top: 12pt;
    display: flex;
    justify-content: space-between;
  }
  .footer a {
    color: #0099ff;
    text-decoration: none;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 600;
  }

  /* ── Footer pinned to bottom (use when content is short) ── */
  .footer-absolute {
    position: absolute;
    bottom: 10mm;
    left: 22mm;
    right: 22mm;
    font-size: 6.5pt;
    color: #9ca3af;
    border-top: 1px solid #e5e7eb;
    padding-top: 5pt;
    display: flex;
    justify-content: space-between;
  }
  .footer-absolute a {
    color: #0099ff;
    text-decoration: none;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 600;
  }

  /* ── Footnote ── */
  .footnote {
    font-size: 6.5pt;
    color: #9ca3af;
    line-height: 1.35;
    margin-top: 3pt;
  }

  /* ── Comparison cards ── */
  .compare-card {
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 8pt;
  }
  .compare-card .question {
    background: #f0f1f3;
    padding: 6pt 10pt;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 700;
    font-size: 8.5pt;
    color: #0a0915;
  }
  .compare-card .question .num { color: #0099ff; }
  .compare-card .responses { display: grid; grid-template-columns: 1fr 1fr; }
  .compare-card .response { padding: 6pt 10pt; font-size: 7.5pt; line-height: 1.4; color: #374151; }
  .compare-card .response.original { background: #fef2f2; }
  .compare-card .response.adjusted { background: #f0fdf4; }
  .compare-card .response .label { margin-bottom: 3pt; }
  .compare-card .response.original .label { color: #b91c1c; }
  .compare-card .response.adjusted .label { color: #15803d; }

  /* ── Callout ── */
  .callout {
    border: 1px solid #e5e7eb;
    border-left: 3px solid #f97316;
    border-radius: 8px;
    padding: 8pt 12pt;
  }
  .callout .callout-title {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 700;
    color: #f97316;
    font-size: 9pt;
    margin-bottom: 3pt;
  }

  /* ── Utility ── */
  .text-blue { color: #0099ff; }
  .text-green { color: #22c55e; }
  .text-purple { color: #a855f7; }
  .text-orange { color: #f97316; }
  .text-white { color: #fff; }
  .text-muted { color: #9ca3af; }
  .fw-800 { font-weight: 800; }
  .font-display { font-family: 'Plus Jakarta Sans', sans-serif; }
</style>
</head>
