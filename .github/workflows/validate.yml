name: validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structure:
    name: Repo structure
    # Canonical-contract check: skipped when this repo is a FORK used as an operator vault.
    # A fork keeps .github/ frozen (Tier 0 never syncs), so its OLD workflow judges NEW
    # content /aios:update legitimately delivered — red mail for healthy files, and pulling
    # the new workflow by hand only moves the error. For a contributor PR this still RUNS:
    # pull_request events evaluate github.event.repository against the BASE repo, not the fork.
    if: github.event.repository.fork != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required top-level files exist
        run: |
          set -e
          for f in README.md CLAUDE.md SETUP.md TOOLS.md INTENT.md USER.md LICENSE NOTICE CHANGELOG.md; do
            test -f "$f" || { echo "::error::Missing required file: $f"; exit 1; }
          done
          echo "OK: all required top-level files present"

      - name: Every root doc is in the /aios:update sync list
        run: |
          set -e
          # A root *.md that isn't named in update.md's Step-2 diff never ships to operator vaults
          # (the class that stranded AGENTS.md / EXTENSION-MAP.md / LICENSE-AUDIT.md). Step 6.5's
          # reconcile now catches these generically at runtime, but this guard keeps the enumerated
          # fast-path list complete + fails the build if a new root doc is added without wiring it in.
          U=plugins/aios/commands/update.md
          MISSING=""
          # Exclude Tier-2 operator files (USER.md, INTENT.md — the /aios:update denylist; they are
          # NEVER synced, so they must NOT be in the sync list) + archival HISTORY-PRE-*.md.
          for f in $(ls *.md | grep -vE '^(HISTORY-PRE-.*|USER\.md|INTENT\.md)$'); do
            grep -qF "\"$f\"" "$U" || MISSING="$MISSING $f"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Root docs NOT in the /aios:update sync list — they would never reach operator vaults:$MISSING"
            echo "Add each (quoted) to update.md's Step-2 diff + its Tier-1 root-docs list."
            exit 1
          fi
          echo "OK: every root *.md is named in the /aios:update sync list"

      - name: Tier-0 canonical-only folders are not in the /aios:update sync path
        run: |
          set -e
          # tests/ and .github/ are repo infrastructure — CI + contributors, never operator vaults.
          # They're excluded from /aios:update by OMISSION from the Tier-1 allowlist, which is
          # invisible to anyone reading that list. This guard makes the omission enforced:
          # if a future change adds them to Step 2's path list or Step 6.5's reconcile loop,
          # the build fails instead of silently shipping CI scaffolding to every operator.
          # (Same belt-and-suspenders shape as the root-docs sync-list check above.)
          U=plugins/aios/commands/update.md
          BAD=""
          # Step 2's git-diff pathspec + Step 6.5's `for p in …` reconcile loop are the two
          # places a directory can enter the sync path. Neither may name a Tier-0 folder.
          if grep -nE '^\s*(git -C .*diff|.*")(.*")?(tests|\.github)/?"' "$U" | grep -q .; then
            BAD="$BAD\n  - a Tier-0 folder appears in a sync pathspec"
          fi
          if grep -E '^\s*for p in .*(tests|\.github)' "$U" | grep -q .; then
            BAD="$BAD\n  - a Tier-0 folder appears in the Step 6.5 reconcile loop"
          fi
          if [ -n "$BAD" ]; then
            printf "::error::tests/ or .github/ entered the /aios:update sync path:%b\n" "$BAD"
            echo "These are Tier 0 (canonical-only) — see update.md § Tier 0. Operators have no CI;"
            echo "shipping them adds files they can neither run nor maintain. Denylist explicitly instead."
            exit 1
          fi
          # ⚠️ The two greps above are NECESSARY BUT NO LONGER SUFFICIENT. They were written
          # against a HARDCODED layer list, where a Tier-0 folder could only enter the sync
          # path by being typed into it. The list is now DERIVED from the clone, so tests/
          # and .github/ enter by default and are held out by TIER0_DENY — which means a
          # pattern-match on the spec text can pass while the real derivation leaks. That is
          # exactly the failure class this guard exists for: a check that cannot observe the
          # case it guards. The executable test below runs the ACTUAL derivation against a
          # fixture tree, and asserts its own falsifiability so it cannot pass vacuously.
          bash tests/update-tier0-denylist.test.sh
          echo "OK: tests/ + .github/ remain canonical-only, and Tier 0 is documented"

      - name: close-session idempotency gate stays falsifiable
        run: |
          set -e
          # The gate's FIRST version was inert: it compared the stamped hash against HEAD, but
          # appending a block COMMITS it, so HEAD always advanced and the equal branch was
          # unsatisfiable by construction. Its logic had 9 trap cases; its reachability had
          # none. Test 1 asserts the duplicate branch CAN fire; test 2 asserts the original
          # logic answers differently on that same input — so neither can pass vacuously.
          bash tests/close-session-idempotency.test.sh
          echo "OK: the duplicate branch is reachable and the fix is falsifiable"

      - name: A source is enabled only by a line the OPERATOR wrote
        run: |
          set -e
          # The template the framework writes into USER.md names the sources in its own
          # blockquotes and italic examples. Those lines carry no negation marker, so the
          # first one used to win the scan — the framework's documentation outvoting the
          # operator's explicit "Slack — no se usa", with no way for them to see why.
          # Test 1 is the canary: a template-only USER.md must enable NOTHING. 9 of the 11
          # assertions fail against the pre-fix parser, so this cannot pass vacuously.
          bash tests/source-detector.test.sh
          echo "OK: template prose does not vote on the operator's configuration"

      - name: Changelog scan handles multi-hash entries; layer pathspec is an array
        run: |
          set -e
          # Two silent bugs found by RUNNING /aios:update instead of hand-executing it.
          # The scan took the first of N cited hashes, so a day's entry with 3 synced +
          # 1 new hash read as fully synced and its new subsections were never shown.
          # And the layer pathspec was a space-joined string passed unquoted — under
          # zsh (the session shell) that is ONE pathspec matching nothing, so every
          # layer change was invisible to Step 2 while Step 6.5 quietly applied it.
          #
          # ⚠️ The dynamic half of this suite REQUIRES zsh: under bash the buggy form
          # works, so a bash-only run cannot prove it. Install zsh here so the proof
          # actually executes rather than reporting a skip that reads like a pass.
          sudo apt-get install -qq -y zsh >/dev/null 2>&1 || true
          command -v zsh >/dev/null 2>&1 && echo "zsh present — dynamic proof will run" \
            || echo "::warning::zsh unavailable; only the static assertions will run"
          bash tests/update-changelog-scan.test.sh
          echo "OK: multi-hash entries surface, and the layer pathspec survives zsh"

      - name: SETUP.md prescribes the right Claude Code installer per platform
        run: |
          set -e
          # install.sh REFUSES Windows (it detects MINGW*/MSYS*/CYGWIN* and exits 1), so the
          # obvious edit — one curl|bash line for all three platform blocks — silently breaks
          # the Windows path. This guard exists because that edit was nearly made.
          WIN=$(awk '/^### Windows \(/{f=1} /^### Linux \(/{f=0} f' SETUP.md)
          UNIXBLOCKS=$(awk '/^### macOS \(/{f=1} /^### Windows \(/{f=0} f' SETUP.md; \
                       awk '/^### Linux \(/{f=1} /^## /{if(f && !/^### Linux \(/)f=0} f' SETUP.md)

          printf '%s' "$WIN" | grep -q 'install\.ps1' || {
            echo "::error::The Windows block must install via install.ps1"; exit 1; }
          printf '%s' "$WIN" | grep -q 'curl .*install\.sh' && {
            echo "::error::The Windows block reaches for install.sh, which REFUSES to run on Windows (exits 1 on MINGW/MSYS/CYGWIN). Use install.ps1."; exit 1; }
          printf '%s' "$UNIXBLOCKS" | grep -q 'install\.sh' || {
            echo "::error::The macOS/Linux blocks must install via install.sh"; exit 1; }
          printf '%s' "$UNIXBLOCKS" | grep -qE 'sudo +curl .*install\.sh' && {
            echo "::error::install.sh refuses sudo on purpose — a root-owned binary is not on the user's PATH."; exit 1; }

          # A failure must surface at the step that caused it, not three steps later.
          test "$(grep -c 'claude --version' SETUP.md)" -ge 3 || {
            echo "::error::Each platform block needs a 'claude --version' verification step."; exit 1; }
          echo "OK: install.sh for macOS/Linux, install.ps1 for Windows, verification in all three"

      - name: Required infra folders + custom/ subfolders exist
        run: |
          set -e
          # Framework-level infra layers (shared resources, not plugin-scoped)
          for layer in agents skills hooks mcps templates; do
            test -d "$layer" || { echo "::error::Missing infra layer: $layer/"; exit 1; }
            test -d "$layer/custom" || { echo "::error::Missing custom/ subfolder: $layer/custom/"; exit 1; }
          done
          # plugins/ holds Claude Code plugins (the aios slash-command plugin + operator custom/ + company-namespaced)
          test -d plugins || { echo "::error::Missing plugins/ folder"; exit 1; }
          test -d plugins/custom || { echo "::error::Missing plugins/custom/ for operator-built plugins (their own plugins, not nested inside aios)"; exit 1; }
          test -d plugins/aios || { echo "::error::Missing plugins/aios/ — the bundled aios plugin"; exit 1; }
          test -d plugins/aios/commands || { echo "::error::Missing plugins/aios/commands/ — the aios plugin's slash commands"; exit 1; }
          # NOTE: no plugins/aios/commands/custom/ — operator custom commands go in their own plugin under plugins/custom/<name>/, not nested inside the aios plugin (canonical Claude Code convention)
          test ! -d plugins/aios/commands/custom || { echo "::error::plugins/aios/commands/custom/ exists but shouldn't — operator-custom slash commands belong in plugins/custom/<your-plugin>/commands/, not nested inside the bundled aios plugin"; exit 1; }
          # Plugin manifest co-location (canonical Claude Code convention)
          test -f .claude-plugin/marketplace.json || { echo "::error::Missing .claude-plugin/marketplace.json at repo root — the marketplace manifest must live here, not in commands/"; exit 1; }
          test -f plugins/aios/.claude-plugin/plugin.json || { echo "::error::Missing plugins/aios/.claude-plugin/plugin.json — plugin manifest must be co-located with plugin source"; exit 1; }
          test ! -f commands/marketplace.json || { echo "::error::commands/marketplace.json exists but shouldn't — manifest moved to .claude-plugin/marketplace.json at repo root (canonical location)"; exit 1; }
          test ! -f commands/plugin.json || { echo "::error::commands/plugin.json exists but shouldn't — manifest moved to plugins/aios/.claude-plugin/plugin.json (co-located with plugin source)"; exit 1; }
          # No top-level commands/ folder — moved into plugins/aios/commands/ during 2026-05-21 canonical refactor
          test ! -d commands || { echo "::error::Top-level commands/ folder exists but shouldn't — slash commands now live at plugins/aios/commands/ as part of the aios plugin"; exit 1; }
          echo "OK: framework infra layers + plugins structure intact + manifests co-located"

      - name: Framework purity — no company-namespaced folders in infra layers
        run: |
          set -e
          # Principle: framework infra ships only bundled paths + custom/ scaffolds.
          # Anything else is company namespace (sovra/, acme/, etc.) — those belong in
          # operator vaults under <layer>/<company>/ via /aios:company --sync, or in
          # a company-template repo, NEVER in this framework bundle.
          #
          # Each layer below has an allowlist of bundled folder names. Anything else
          # at depth 1 fails the check, with the error pointing at the canonical fix.

          FOUND=""

          # agents/ — allowed: aios (nested bundles inside) + custom
          # Nested layout adopted v0.2.0: agents/aios/{sales,strategy,finance-legal,engineering,communication,personal}/
          for dir in agents/*/; do
            name=$(basename "$dir")
            case "$name" in
              aios|custom) ;;
              *) FOUND+=$'\n  - agents/'"$name"'/  (expected: aios/ or custom/)' ;;
            esac
          done

          # agents/aios/ — allowed bundles: sales, strategy, finance-legal, engineering, communication, personal
          for dir in agents/aios/*/; do
            name=$(basename "$dir")
            case "$name" in
              sales|strategy|finance-legal|engineering|communication|personal) ;;
              *) FOUND+=$'\n  - agents/aios/'"$name"'/  (expected: one of: sales, strategy, finance-legal, engineering, communication, personal)' ;;
            esac
          done

          # plugins/ — allowed: aios + custom
          for dir in plugins/*/; do
            name=$(basename "$dir")
            case "$name" in
              aios|custom) ;;
              *) FOUND+=$'\n  - plugins/'"$name"'/  (expected: aios/ or custom/)' ;;
            esac
          done

          # hooks/ — allowed: claude-identity + git (aios-commit pre-commit guard + secret-scan) + custom
          # (files are layer-level; only subfolders checked)
          for dir in hooks/*/; do
            name=$(basename "$dir")
            case "$name" in
              claude-identity|git|custom) ;;
              *) FOUND+=$'\n  - hooks/'"$name"'/  (expected: claude-identity/, git/, or custom/)' ;;
            esac
          done

          # mcps/ — allowed: *-mcp (suffix convention) + custom
          for dir in mcps/*/; do
            name=$(basename "$dir")
            case "$name" in
              custom) ;;
              *-mcp) ;;
              *) FOUND+=$'\n  - mcps/'"$name"'/  (expected: *-mcp/ or custom/)' ;;
            esac
          done

          # templates/ — bundled templates live in aios/, operator extensions in custom/
          # (company-distributed templates land in {company}/ via /aios:company --sync).
          for dir in templates/*/; do
            name=$(basename "$dir")
            case "$name" in
              aios|custom) ;;
              *) FOUND+=$'\n  - templates/'"$name"'/  (expected: aios/ for bundled templates, custom/ for operator extensions — company namespaces land via /aios:company)' ;;
            esac
          done

          # skills/ — source-grouped. Allowed: aios/, superpowers/, df-claude-skills/, custom/
          # Anything else at depth 1 is either a new upstream source (update this allowlist + skills/_index.md)
          # or a company namespace that shouldn't be in the framework.
          for dir in skills/*/; do
            name=$(basename "$dir")
            case "$name" in
              aios|anthropic|superpowers|custom) ;;
              *) FOUND+=$'\n  - skills/'"$name"'/  (expected: aios/, anthropic/, superpowers/, or custom/ — vendoring a new upstream? add it to the allowlist in this workflow + document in skills/_index.md)' ;;
            esac
          done

          # skills/ at depth 2 — block known company prefixes that might sneak in under a source folder
          shopt -s nullglob
          for source_folder in skills/aios skills/anthropic skills/superpowers; do
            for company_prefix in sovra acme chuycepeda chuy zineb sarah; do
              for dir in "$source_folder/$company_prefix"/ "$source_folder/$company_prefix-"*/; do
                [ -d "$dir" ] && FOUND+=$'\n  - '"$dir"'  (company-namespaced skill — relocate to operator vault under skills/'"$company_prefix"'/)'
              done
            done
          done
          shopt -u nullglob

          if [ -n "$FOUND" ]; then
            echo "::error::Company-namespaced content found in framework infra layers:"
            echo "$FOUND"
            echo ""
            echo "Framework infra ships only operator-agnostic, bundled content. Company-specific paths belong in:"
            echo "  - operator vaults under <layer>/<company>/ (synced via /aios:company)"
            echo "  - or a company-template repo (distributed via /aios:company --sync)"
            echo ""
            echo "If you're adding a NEW bundled framework path that legitimately doesn't fit the allowlist (e.g., a new agent bundle), update this workflow's allowlist in the same PR."
            exit 1
          fi
          echo "OK: framework infra layers contain only bundled paths + custom/ scaffolds"

      - name: Agent bundles exist with README.md + top-level registry
        run: |
          set -e
          test -f "agents/_index.md" || { echo "::error::Missing canonical registry: agents/_index.md"; exit 1; }
          for bundle in sales strategy finance-legal engineering communication personal; do
            test -d "agents/aios/$bundle" || { echo "::error::Missing agent bundle: agents/aios/$bundle/"; exit 1; }
            test -f "agents/aios/$bundle/README.md" || { echo "::error::Missing bundle README: agents/aios/$bundle/README.md"; exit 1; }
          done
          echo "OK: all 6 agent bundles present at agents/aios/{bundle}/ with README.md, and agents/_index.md is in place"

      - name: No root doc claims a surface is limited to one platform
        run: |
          set -e
          # WHY: SETUP.md told Windows and Linux operators "The AIOS App is macOS-only for now"
          # for THREE DAYS after both platforms shipped (Linux v0.8.2 on 08-12, Windows v0.8.3 on
          # 08-13). A Windows visitor following it was routed to install an IDE *and* an extension
          # when one installer would do — the "download, wizard, working" bar pointing backwards.
          # It was found by watching a real person onboard, which is the expensive way to find it.
          #
          # This is the second time in one week a doc outlived a shipped platform, so the class
          # gets a check rather than another correction. A platform-exclusivity claim about our own
          # surfaces is a fact with an expiry date, and the docs cannot know when it expired.
          #
          # Deliberately NARROW: it forbids the exclusivity CLAIM, not the platform names. Naming
          # macOS, Windows or Linux is normal and necessary in an install guide; asserting a
          # surface exists on only one of them is the thing that rots.
          #
          # CHANGELOG.md is EXCLUDED, and not as a convenience. It is append-only history, so an
          # entry describing what was true on its own date is correct BY DEFINITION — `843` reads
          # "The app is macOS-only today", which was accurate when written and is evidence now.
          # Rewriting it to satisfy a check would be editing the record to make the present tidy.
          # Caught by this check's own control on its first run, which flagged exactly that line.
          BAD=""
          for f in $(git ls-files '*.md' | grep -v '/' | grep -v '^CHANGELOG.md$'); do
            hits=$(grep -nEi '(app|glass|aios)[^.]{0,24}\bis (macos|mac|windows|linux)-only' "$f" || true)
            [ -n "$hits" ] && BAD="$BAD$f:"$'\n'"$hits"$'\n'
          done
          if [ -n "$BAD" ]; then
            echo "::error::A root doc asserts one of our surfaces is limited to a single platform. If that was true when written, it has an expiry date — check what actually ships before re-asserting it:"
            printf '%s' "$BAD"
            exit 1
          fi
          echo "OK: no root doc claims a single-platform limitation"

      - name: Every tracked .sh carries the exec bit
        run: |
          set -e
          # WHY THIS EXISTS: `test-identity-cycle.sh` shipped at 100644 while all 26 of its
          # siblings were 100755 — the mode is recorded from the contributor's filesystem, and
          # nothing looked at it. `./hooks/claude-identity/test-identity-cycle.sh` then answers
          # "Permission denied" for the operator, while CI stayed green because every CI caller
          # invokes suites as `bash <path>`. A check that runs the thing one way can never see
          # a defect that only shows up the other way; this looks at the mode directly.
          #
          # WHY .sh AND NOT "has a shebang": measured across the tree, the shebang rule flags 5
          # files that are CORRECTLY non-executable (hooks/pipeline-executor.py and friends are
          # invoked as `python3 <path>` by their callers, never run directly). A rule with known
          # false positives gets muted, so the narrow one is the useful one: at the time of
          # writing, 27 tracked .sh files, 27 expected at 755.
          #
          # If you ever add a .sh that is meant to be SOURCED rather than executed, add it to
          # SOURCED_OK below in the same PR — deliberately, so the exception is visible to the
          # next reader instead of being an omission nobody can see.
          SOURCED_OK=""
          BAD=""
          while IFS= read -r line; do
            mode=${line%% *}; path=${line#*$'\t'}
            case " $SOURCED_OK " in *" $path "*) continue ;; esac
            [ "$mode" = "100755" ] || BAD="$BAD  $mode  $path"$'\n'
          done < <(git ls-files -s '*.sh')
          if [ -n "$BAD" ]; then
            echo "::error::Shell script(s) tracked without the exec bit — 'chmod +x' then 'git add --chmod=+x':"
            printf '%s' "$BAD"
            exit 1
          fi
          echo "OK: all $(git ls-files '*.sh' | wc -l | tr -d ' ') tracked .sh files are mode 755"

      - name: Every tracked executable has an explicit eol (CRLF would break its shebang)
        run: |
          set -e
          # THE SAME MISSED-ENUMERATION CLASS AS THE STEP ABOVE, one attribute over.
          # .gitattributes listed extensionless hook executables BY NAME. A third one was added
          # later and missed the list, so on Windows (core.autocrlf=true by default) it would
          # check out with CRLF and Git Bash would answer `bad interpreter`. The worst instance
          # was not the new file at all: `hooks/git/pre-commit` had never been listed, and git
          # runs hooks through `sh` — so on Windows the secret scan that gates every commit
          # would simply not execute, with nothing printed to say so.
          #
          # An executable is a thing something tries to RUN, so its line endings are load-bearing
          # by definition. Requiring an explicit eol for all of them means the next addition
          # fails here instead of failing silently on somebody's Windows machine.
          BAD=""
          while IFS= read -r f; do
            attr=$(git check-attr eol -- "$f" | sed 's/.*eol: //')
            [ "$attr" = "unspecified" ] && BAD="$BAD  $f"$'\n'
          done < <(git ls-files -s | awk '$1=="100755"{ sub(/^[^\t]*\t/,""); print }')
          if [ -n "$BAD" ]; then
            echo "::error::Tracked executable(s) with no eol attribute — add a rule to .gitattributes:"
            printf '%s' "$BAD"
            exit 1
          fi
          echo "OK: all $(git ls-files -s | awk '$1=="100755"' | wc -l | tr -d ' ') tracked executables have an explicit eol"

      - name: No .ps1 uses "$var:" with a non-scope prefix (5.1 parse error)
        run: |
          set -e
          # `$r:` is not a typo PowerShell tolerates — it parses as a SCOPE QUALIFIER, the same
          # syntax as $env:PATH or $global:x. With an unknown prefix the file does not fail at
          # runtime, it fails to PARSE, so the entire script is dead on load. It cost a full CI
          # cycle on a Windows runner to find one occurrence of it inside a double-quoted string.
          #
          # This is a static check on purpose: the Windows PowerShell 5.1 lane catches the same
          # thing, but only after a Windows runner boots, and it is the ONLY lane that can — so
          # anyone without one is authoring blind. Fourteen seconds on ubuntu closes that gap.
          # The fix is always the same: write ${var} instead of $var before the colon.
          # COMMENT-AWARE, and it has to be: the first draft flagged its own explanatory comment
          # (which quotes the bad pattern in order to describe it), and — worse — the control
          # that was supposed to prove the check works was then also measuring that comment
          # rather than the code. A checker that cannot tell code from prose about code reports
          # on the wrong thing twice.
          python3 - <<'PYCHK'
          import re, subprocess, sys
          SCOPES = {"env","global","script","local","private","using","variable","function","alias","workflow"}
          files = subprocess.run(["git","ls-files","*.ps1"], capture_output=True, text=True).stdout.split()
          pat = re.compile(r'\$([A-Za-z_][A-Za-z0-9_]*):')
          bad = []
          for f in files:
              src = open(f, encoding="utf-8", errors="replace").read()
              src = re.sub(r'<#.*?#>', lambda m: "\n"*m.group(0).count("\n"), src, flags=re.S)  # block comments
              for n, line in enumerate(src.split("\n"), 1):
                  code = line.split("#", 1)[0]                                                   # line comments
                  for m in pat.finditer(code):
                      if m.group(1) not in SCOPES:
                          # Built by concatenation so the literal characters "${" and "{" are
                          # never adjacent IN THIS FILE. Actions treats a doubled-brace token in
                          # a run: block as an EXPRESSION, one layer ABOVE YAML, and substitutes
                          # it into the raw string BEFORE any shell sees it — so an accidental one
                          # makes the whole workflow invalid, and neither yaml.safe_load nor
                          # executing the extracted step can detect that. A comment is not a safe
                          # place to write one either, for exactly the same reason.
                          sug = "$" + "{" + m.group(1) + "}"
                          bad.append(f"  {f}:{n}: ${m.group(1)}:  ->  use {sug}:")
          if bad:
              print("::error::A .ps1 uses $var: with a prefix that is not a PowerShell scope. That is a PARSE error under 5.1 — the whole file fails to load, not just that line:")
              print("\n".join(bad)); sys.exit(1)
          print(f"OK: no .ps1 misuses the scope-qualifier syntax across {len(files)} files")
          PYCHK

      - name: The two star-check implementations agree
        run: |
          set -e
          # aios-star-check exists twice — bash for the shell callers, PowerShell because the
          # Windows callers (Electron App, Node extension host) cannot assume Git Bash is on
          # PATH. Its own header says not to duplicate this logic, so the duplication is
          # guarded here instead of trusted: the two must name the SAME repos and the SAME
          # verdicts. This is the check that makes the second file acceptable; delete it and
          # the pair silently diverges the way the bus fulfillers did.
          SH=hooks/aios-star-check; PS=hooks/aios-star-check.ps1
          test -f "$SH" && test -f "$PS" || { echo "::error::star-check pair incomplete"; exit 1; }

          # Repos each file would ever ask about, in sorted order.
          repos_of() { grep -oE 'The-AIOS/aios(-app|-glass)?' "$1" | sort -u | tr '\n' ' '; }
          R_SH=$(repos_of "$SH"); R_PS=$(repos_of "$PS")
          if [ "$R_SH" != "$R_PS" ]; then
            echo "::error::star-check repo allowlists diverge."
            echo "  bash: $R_SH"
            echo "  ps1 : $R_PS"
            exit 1
          fi

          # A private repo in either list is a permanent failure for every user — see the
          # comment in the bash version. Assert neither ever names one.
          for f in "$SH" "$PS"; do
            if grep -qE "['\"]The-AIOS/(forum|site|org|company-template)" "$f"; then
              echo "::error::$f names a repo that must never be in the ask (private, or a non-discovery repo)"
              exit 1
            fi
          done

          # The four verdicts are the contract the surfaces switch on.
          for v in starred unstarred declined unknown; do
            grep -q "$v" "$SH" || { echo "::error::$SH lost verdict '$v'"; exit 1; }
            grep -q "$v" "$PS" || { echo "::error::$PS lost verdict '$v'"; exit 1; }
          done
          echo "OK: star-check implementations agree — repos [$R_SH] and all four verdicts present in both"

  manifests:
    name: Plugin manifests
    # Canonical-contract check: skipped when this repo is a FORK used as an operator vault.
    # A fork keeps .github/ frozen (Tier 0 never syncs), so its OLD workflow judges NEW
    # content /aios:update legitimately delivered — red mail for healthy files, and pulling
    # the new workflow by hand only moves the error. For a contributor PR this still RUNS:
    # pull_request events evaluate github.event.repository against the BASE repo, not the fork.
    if: github.event.repository.fork != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: marketplace.json + plugin.json parse as valid JSON
        run: |
          set -e
          python3 -c "import json; json.load(open('.claude-plugin/marketplace.json'))" && echo "OK: marketplace.json"
          python3 -c "import json; json.load(open('plugins/aios/.claude-plugin/plugin.json'))" && echo "OK: plugin.json"

      - name: Manifest versions match
        run: |
          set -e
          MP_VERSION=$(python3 -c "import json; d=json.load(open('.claude-plugin/marketplace.json')); print(d['plugins'][0]['version'])")
          PL_VERSION=$(python3 -c "import json; print(json.load(open('plugins/aios/.claude-plugin/plugin.json'))['version'])")
          if [ "$MP_VERSION" != "$PL_VERSION" ]; then
            echo "::error::Version mismatch — marketplace.json says $MP_VERSION, plugin.json says $PL_VERSION"
            exit 1
          fi
          echo "OK: both manifests on version $MP_VERSION"

      - name: Manifest names match expected (aios @ the-aios)
        run: |
          set -e
          MP_NAME=$(python3 -c "import json; print(json.load(open('.claude-plugin/marketplace.json'))['name'])")
          PL_NAME=$(python3 -c "import json; print(json.load(open('plugins/aios/.claude-plugin/plugin.json'))['name'])")
          PLUGIN_NAME=$(python3 -c "import json; print(json.load(open('.claude-plugin/marketplace.json'))['plugins'][0]['name'])")
          [ "$MP_NAME" = "the-aios" ] || { echo "::error::marketplace.json name should be 'the-aios', got '$MP_NAME'"; exit 1; }
          [ "$PL_NAME" = "aios" ] || { echo "::error::plugin.json name should be 'aios', got '$PL_NAME'"; exit 1; }
          [ "$PLUGIN_NAME" = "aios" ] || { echo "::error::marketplace plugin entry should be 'aios', got '$PLUGIN_NAME'"; exit 1; }
          echo "OK: manifest naming is aios @ the-aios"

  frontmatter:
    name: YAML frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PyYAML
        run: pip install pyyaml

      - name: All command + agent + skill files have parseable frontmatter
        run: |
          python3 <<'PY'
          import sys, yaml, glob

          failures = []
          patterns = [
              "plugins/aios/commands/*.md",
              "agents/aios/*/*.md",
              "skills/*/*/SKILL.md",
              "templates/aios/*.md",
          ]

          for pat in patterns:
              for path in glob.glob(pat):
                  if path.endswith("_index.md"):
                      continue
                  with open(path) as f:
                      content = f.read()
                  if not content.startswith("---\n"):
                      continue
                  try:
                      end = content.index("\n---\n", 4)
                      fm = content[4:end]
                      yaml.safe_load(fm)
                  except (ValueError, yaml.YAMLError) as e:
                      failures.append(f"{path}: {e}")

          if failures:
              print("::error::Frontmatter parse failures:")
              for f in failures:
                  print(f"  - {f}")
              sys.exit(1)
          total = sum(len(glob.glob(p)) for p in patterns)
          print(f"OK: frontmatter validated across {total} files")
          PY

  personalization:
    name: Personalization guard
    # Canonical-contract check: skipped when this repo is a FORK used as an operator vault.
    # A fork keeps .github/ frozen (Tier 0 never syncs), so its OLD workflow judges NEW
    # content /aios:update legitimately delivered — red mail for healthy files, and pulling
    # the new workflow by hand only moves the error. For a contributor PR this still RUNS:
    # pull_request events evaluate github.event.repository against the BASE repo, not the fork.
    if: github.event.repository.fork != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: PR adds no personal vault content
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -e
          ADDED=$(git diff --name-status "$BASE_SHA".."$HEAD_SHA" | awk '$1=="A"{print $2}')
          BAD=$(echo "$ADDED" | grep -E '^vault/' | grep -v '\.gitkeep$' | grep -v '^vault/\.obsidian/' || true)
          if [ -n "$BAD" ]; then
            echo "::error::PR adds personal vault content. Operator data belongs in your own private vault, not the framework:"
            echo "$BAD" | sed 's/^/  - /'
            echo ""
            echo "Only .gitkeep (folder scaffolding) and vault/.obsidian/* (shared workspace config) are allowed under vault/."
            exit 1
          fi
          echo "OK: no personal vault content added"

      - name: USER.md + INTENT.md still template-shaped (EXAMPLE ONLY markers present)
        run: |
          set -e
          for f in USER.md INTENT.md; do
            if ! grep -q "EXAMPLE ONLY" "$f"; then
              echo "::error::$f no longer contains 'EXAMPLE ONLY' markers — looks like real personal data was committed. The framework ships templates; operators fill them in their own private vault."
              exit 1
            fi
          done
          echo "OK: USER.md + INTENT.md still template-shaped"

      - name: No infra files reference personal-vault notes
        run: |
          set -e
          # Per the 'infra never links to personal' rule: commands/, agents/, hooks/,
          # mcps/, plugins/, templates/, skills/, and root docs should never reference
          # personal-vault notes like [[ai-os]], [[chuy-*]], [[advisory-*]] — those
          # wikilinks resolve only in the author's vault, not in other operators'.
          if grep -rln -E '\[\[(ai-os|chuy-|advisory-[a-z]+)\]\]' \
            --include="*.md" --include="*.yml" --include="*.yaml" --include="*.json" \
            --exclude-dir=.git --exclude-dir=.github --exclude-dir=vault --exclude="HISTORY-PRE-*.md" --exclude="CHANGELOG.md" .; then
            echo "::error::Infra file references personal-vault notes — those wikilinks won't resolve in other operators' vaults"
            exit 1
          fi
          echo "OK: no infra→personal-vault wikilinks"

  credentials:
    name: Credentials guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No credential-shaped files in tree (secrets, tokens, cookies, OAuth, certs, keys)
        run: |
          set -e
          # Pattern-based scan for files that look like real credentials. The framework
          # ships only *.template files; real credentials are operator-specific and must
          # stay gitignored. This is a path/filename check — content-based secret detection
          # is handled by GitHub Push Protection at push time (layered defense).
          #
          # Categories covered:
          # - Cryptographic keys: *.key, *.pem, *.pfx, *.p12, *.cer, *.crt
          # - Token/credential files: token.json, credentials.json, *-tokens.json
          # - Secret-named JSON: *secret*.json, *credentials*.json, *oauth*.json
          # - Environment files: .env, .env.local
          # - Browser session state: storage_state.json, cookies.json, **/auth/*.json
          # - Spotify/Slack/etc. cache: *spotify*cache*.json, *.slack-tokens.json
          # - OAuth callback artifacts: auth_link.html
          FOUND=$(
            {
              find . -type f \( \
                -name "*.key" -o \
                -name "*.pem" -o \
                -name "*.pfx" -o \
                -name "*.p12" -o \
                -name "*.cer" -o \
                -name "*.crt" -o \
                -name "token.json" -o \
                -name "credentials.json" -o \
                -name ".env" -o \
                -name ".env.local" -o \
                -name "storage_state.json" -o \
                -name "cookies.json" -o \
                -name "auth_link.html" -o \
                -name "*-tokens.json" -o \
                -name ".slack-mcp-tokens.json" -o \
                -name "spotify-cache.json" \
              \) -not -path "./.git/*" -not -path "./vault/.obsidian/*" 2>/dev/null
              find . -type f -name "*oauth*.json" -not -name "*.template" -not -path "./.git/*" 2>/dev/null
              find . -type f -name "*secret*.json" -not -name "*.template" -not -path "./.git/*" 2>/dev/null
              find . -type f -name "*credentials*.json" -not -name "*.template" -not -path "./.git/*" 2>/dev/null
              find . -type f -path "*/auth/*.json" -not -path "./.git/*" 2>/dev/null
            } | sort -u
          )
          if [ -n "$FOUND" ]; then
            echo "::error::Credential-shaped files found in tree. Only *.template files ship; real credentials must stay gitignored:"
            echo "$FOUND" | sed 's/^/  - /'
            echo ""
            echo "If these are legitimate (e.g., a *.key file that's actually not a credential), add the specific path to an allowlist in this workflow. If they're real credentials: 'git rm --cached <file>', verify .gitignore covers them, rotate the leaked credential immediately, and recommit without the file."
            exit 1
          fi
          echo "OK: no credential-shaped files in tree"

  drift:
    name: Migration drift
    # Canonical-contract check: skipped when this repo is a FORK used as an operator vault.
    # A fork keeps .github/ frozen (Tier 0 never syncs), so its OLD workflow judges NEW
    # content /aios:update legitimately delivered — red mail for healthy files, and pulling
    # the new workflow by hand only moves the error. For a contributor PR this still RUNS:
    # pull_request events evaluate github.event.repository against the BASE repo, not the fork.
    if: github.event.repository.fork != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No references to retired vault-commands@local naming
        run: |
          set -e
          if grep -rln "vault-commands@local\|aios@local\b" \
            --include="*.md" --include="*.json" --include="*.yml" --include="*.yaml" \
            --exclude="CHANGELOG.md" --exclude="HISTORY-PRE-*.md" \
            --exclude-dir=.git --exclude-dir=vault --exclude-dir=.github .; then
            echo "::error::Retired slug found outside CHANGELOG/history files (see grep output above)"
            exit 1
          fi
          echo "OK: no stale vault-commands@local or aios@local references"

      - name: No references to retired folder paths
        run: |
          set -e
          if grep -rln "vault/06 - agents\|vault/02 - templates" \
            --include="*.md" --include="*.json" --include="*.yml" --include="*.yaml" \
            --exclude="CHANGELOG.md" --exclude="HISTORY-PRE-*.md" \
            --exclude-dir=.git --exclude-dir=vault --exclude-dir=.github .; then
            echo "::error::Retired folder path found outside CHANGELOG/history files (see grep output above)"
            exit 1
          fi
          echo "OK: no stale vault/06 - agents or vault/02 - templates references"

      - name: No references to retired ~/obsidian path (canonical install is ~/aios)
        run: |
          set -e
          if grep -rln "~/obsidian\|/Users/.*/obsidian\|\$HOME/obsidian" \
            --include="*.md" --include="*.py" --include="*.sh" --include="*.json" --include="*.yml" --include="*.yaml" \
            --exclude="CHANGELOG.md" --exclude="HISTORY-PRE-*.md" \
            --exclude-dir=.git --exclude-dir=vault --exclude-dir=.github .; then
            echo "::error::Retired ~/obsidian path reference found. Canonical install location is ~/aios (framework brand). Update any hardcoded paths in the offending files."
            exit 1
          fi
          echo "OK: no ~/obsidian hardcoded paths — framework is install-path-agnostic with ~/aios canonical default"

      # The check above greps for the path as TEXT. It therefore passed for two months while
      # hooks/pipeline-executor.py resolved USER.md from `Path.home() / "obsidian"` — the same
      # retired path, assembled programmatically, so not one of the textual patterns matched.
      # The guard reported "no hardcoded paths" about a state it had never examined, and an
      # operator whose vault was elsewhere silently lost their entire USER.md config on every
      # /today. A guard that only knows one spelling of the thing it forbids is not a guard.
      - name: No programmatic hardcoding of the retired vault folder name
        run: |
          set -e
          # Matches home-dir + literal "obsidian" joined in code, any language/quoting:
          #   Path.home() / "obsidian"   ·   Path.home()/'obsidian'   ·   os.path.expanduser + join
          #   $(HOME)/obsidian in make/shell   ·   home_dir().join("obsidian")
          # NOTE: `.{0,40}` not `[^\n]{0,40}` — in a POSIX bracket expression `\n` is the two
          # literal characters, so `[^\n]` excludes the LETTER n. grep is line-based anyway.
          if grep -rlnE "(Path\.home\(\)|expanduser|homedir|home_dir\(\)|HOME).{0,40}['\"]obsidian['\"]" \
            --include="*.md" --include="*.py" --include="*.sh" --include="*.ps1" --include="*.json" --include="*.yml" --include="*.yaml" \
            --exclude="CHANGELOG.md" --exclude="HISTORY-PRE-*.md" \
            --exclude-dir=.git --exclude-dir=vault --exclude-dir=.github .; then
            echo "::error::The retired vault folder name is being assembled programmatically (see files above). Derive the framework root from the file's own location instead — e.g. Path(__file__).resolve().parent.parent — so it works wherever the operator cloned."
            exit 1
          fi
          echo "OK: no programmatic assembly of the retired vault folder name"

      # `~/aios` IS the documented install path, so this is not a retired-name check — shell
      # commands and docs may reference it freely, and this step deliberately does not look at
      # *.sh / *.md. The rule is narrower: framework CODE that can locate itself must not depend
      # on the symlink being present. When it did, the failure was silent and self-inflicted —
      # two MCP servers joined the home dir to a literal "aios" segment and then called
      # mkdir(parents=True), so with no symlink they CREATED a phantom ~/aios/vault tree and
      # wrote the operator's PDFs and images into it while reporting success. Deriving the root
      # from __file__ cannot do that. Scoped to code files; `~/.cache/aios/...` (a genuinely
      # home-owned cache) does not match, because the pattern requires "aios" as a whole segment.
      - name: Framework code must self-locate, not hardcode the ~/aios install path
        run: |
          set -e
          if grep -rlnE "(Path\.home\(\)|homedir|home_dir\(\)).{0,20}['\"]aios['\"]|expanduser\(['\"]~/aios" \
            --include="*.py" --include="*.js" --include="*.ts" \
            --exclude-dir=.git --exclude-dir=.venv --exclude-dir=node_modules --exclude-dir=site-packages \
            --exclude-dir=vault --exclude-dir=.github .; then
            echo "::error::Framework code is hardcoding the ~/aios install path (see files above). That depends on the operator's symlink existing, and a mkdir(parents=True) on such a path silently creates a phantom vault instead of failing. Derive the root from the file's own location — e.g. Path(__file__).resolve().parents[N] — counting parents from where the file actually lives."
            exit 1
          fi
          echo "OK: framework code self-locates instead of hardcoding ~/aios"

  counts:
    name: Capability counts
    # Canonical-contract check: skipped when this repo is a FORK used as an operator vault.
    # A fork keeps .github/ frozen (Tier 0 never syncs), so its OLD workflow judges NEW
    # content /aios:update legitimately delivered — red mail for healthy files, and pulling
    # the new workflow by hand only moves the error. For a contributor PR this still RUNS:
    # pull_request events evaluate github.event.repository against the BASE repo, not the fork.
    if: github.event.repository.fork != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Doc count claims match bundled ground truth
        run: |
          set -e
          # Ground truth = framework-BUNDLED counts, EXCLUDING custom/ and {company}/
          # namespaces (sovra/, acme/, …). Layered folders count their bundled
          # source-peers (skills = aios + anthropic + superpowers); flat folders count
          # root entries by convention (mcps = *-mcp/). This mirrors the operating rule:
          # "AIOS numbers, not sovra, not custom." Counts are hand-maintained in several
          # docs (TOOLS.md source-folders line, README.md) + the site repo (separate, not
          # checked here) — this job kills the drift class for the docs in THIS repo.
          CMD=$(ls plugins/aios/commands/*.md 2>/dev/null | grep -v _index | wc -l | tr -d ' ')
          AGENTS=$(find agents/aios -name '*.md' ! -name '_index.md' ! -name 'README.md' | wc -l | tr -d ' ')
          S_AIOS=$(ls -d skills/aios/*/ 2>/dev/null | wc -l | tr -d ' ')
          S_ANTH=$(ls -d skills/anthropic/*/ 2>/dev/null | wc -l | tr -d ' ')
          S_SUP=$(ls -d skills/superpowers/*/ 2>/dev/null | wc -l | tr -d ' ')
          S_TOTAL=$((S_AIOS + S_ANTH + S_SUP))
          MCPS=$(ls -d mcps/*-mcp/ 2>/dev/null | wc -l | tr -d ' ')
          echo "Ground truth: commands=$CMD agents=$AGENTS skills=${S_AIOS}+${S_ANTH}+${S_SUP}=${S_TOTAL} mcps=$MCPS"

          FAIL=0
          check() { # $1=label $2=expected(truth) $3=claimed $4=where
            if [ -z "$3" ]; then
              echo "::error::$4: no '$1' count claim found (expected $2) — did the count-bearing sentence get reworded? Update this check's regex or restore the phrasing."; FAIL=1
            elif [ "$3" != "$2" ]; then
              echo "::error::$4: '$1' claims $3 but bundled ground truth is $2 — update $4 (or this is your reminder to fix the doc in the same PR that changed the count)"; FAIL=1
            fi
          }

          # TOOLS.md — skill source-folder counts (anchored on stable source names)
          check "aios skills"        "$S_AIOS"  "$(grep -oE 'AIOS-built[^0-9]+[0-9]+ skills' TOOLS.md | grep -oE '[0-9]+' | head -1)"        "TOOLS.md"
          check "anthropic skills"   "$S_ANTH"  "$(grep -oE 'anthropics/skills[^0-9]+[0-9]+ skills' TOOLS.md | grep -oE '[0-9]+' | head -1)" "TOOLS.md"
          check "superpowers skills" "$S_SUP"   "$(grep -oE 'obra/superpowers[^0-9]+[0-9]+ skills' TOOLS.md | grep -oE '[0-9]+' | head -1)"  "TOOLS.md"
          check "total bundled"      "$S_TOTAL" "$(grep -oE 'Total bundled: [0-9]+' TOOLS.md | grep -oE '[0-9]+' | head -1)"                  "TOOLS.md"

          # README.md — command count
          check "commands"           "$CMD"     "$(grep -oE '\*\*[0-9]+ commands' README.md | grep -oE '[0-9]+' | head -1)"                   "README.md"

          # agents/_index.md — total bundled agents (the registry's own claim)
          check "agents (index total)" "$AGENTS" "$(grep -oE 'Total bundled agents: [0-9]+' agents/_index.md | grep -oE '[0-9]+' | head -1)" "agents/_index.md"
          # cross-check: the per-bundle Count column should also sum to ground truth
          BUNDLE_SUM=$(grep -oE '\*\*`aios/[a-z-]+/`\*\* \| [^|]+ \| [0-9]+' agents/_index.md | grep -oE '[0-9]+$' | paste -sd+ - | bc 2>/dev/null || echo "")
          if [ -n "$BUNDLE_SUM" ]; then check "agents (bundle-table sum)" "$AGENTS" "$BUNDLE_SUM" "agents/_index.md"; fi

          if [ "$FAIL" = "1" ]; then
            echo ""
            echo "Capability-count drift detected. The numbers in the docs above no longer match the bundled folders. This is the antifragile guard for the count class (added 2026-05-28 after agents/skills counts silently drifted across TOOLS.md + the site)."
            exit 1
          fi
          echo "OK: all capability-count claims match bundled ground truth"

  skill_resolution:
    name: Skill resolution
    # Canonical-contract check: skipped when this repo is a FORK used as an operator vault.
    # A fork keeps .github/ frozen (Tier 0 never syncs), so its OLD workflow judges NEW
    # content /aios:update legitimately delivered — red mail for healthy files, and pulling
    # the new workflow by hand only moves the error. For a contributor PR this still RUNS:
    # pull_request events evaluate github.event.repository against the BASE repo, not the fork.
    if: github.event.repository.fork != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every agent skill reference resolves to a bundled skill
        run: |
          python3 <<'PY'
          import sys, glob, os, re

          # Ground truth: a skill "resolves" if skills/<source>/<name>/SKILL.md exists.
          # Source ∈ aios | anthropic | superpowers | custom (the source-grouped layout).
          valid = set()
          for skill_md in glob.glob("skills/*/*/SKILL.md"):
              valid.add(os.path.basename(os.path.dirname(skill_md)))

          # Parse each bundled agent's "## Skills" section and extract the skill each
          # bullet names (the first backtick-quoted token on a "- `name` — ..." line).
          skills_heading = re.compile(r'^## Skills\s*$')
          section_end    = re.compile(r'^## ')          # next level-2 heading closes the section
          bullet_skill   = re.compile(r'^-\s+`([^`]+)`')  # "- `skill-name` — description"

          agent_files = [
              p for p in glob.glob("agents/aios/*/*.md")
              if os.path.basename(p) not in ("_index.md", "README.md")
          ]

          failures = []
          for path in agent_files:
              with open(path) as f:
                  lines = f.read().splitlines()
              in_section = False
              for line in lines:
                  if skills_heading.match(line):
                      in_section = True
                      continue
                  if in_section and section_end.match(line):
                      in_section = False
                      continue
                  if not in_section:
                      continue
                  m = bullet_skill.match(line)
                  if not m:
                      continue
                  name = m.group(1).strip()
                  # Plugin-namespaced references (e.g. `document-skills:xlsx`) point at
                  # skills provided by Claude Code's plugin marketplace, not this repo's
                  # bundled tree — out of scope for local resolution. Skip them.
                  if ":" in name:
                      continue
                  if name not in valid:
                      failures.append((path, name))

          if failures:
              print("::error::Agent(s) reference bundled skills that don't resolve to skills/*/<name>/SKILL.md:")
              for path, name in failures:
                  print(f"  - {path} -> `{name}`  (no skills/*/{name}/SKILL.md)")
              print("")
              print("A shipped agent must not point at a missing skill. Fix by authoring the skill under")
              print("skills/<source>/<name>/ (source in aios|anthropic|superpowers|custom), or correct/remove")
              print("the stale reference. Plugin-namespaced refs like `document-skills:xlsx` are intentionally")
              print("skipped (resolved by the plugin marketplace, not this bundle).")
              sys.exit(1)

          print(f"OK: all bundled skill references across {len(agent_files)} agents resolve to skills/*/<name>/SKILL.md")
          PY

  identity_backends:
    name: Identity manager — both credential backends (${{ matrix.os }})
    # Canonical-contract check, so it carries the fork guard like its siblings.
    if: github.event.repository.fork != true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Credential-cycle suite
        shell: bash
        run: |
          set -e
          # WHY BOTH OSes: the credential store is chosen by `uname` — Keychain on Darwin,
          # a plaintext file everywhere else — so a single-OS run exercises exactly one
          # backend and certifies nothing about the other. That is not hypothetical: this
          # suite reported 25/25 against the file backend while, on macOS, three of its
          # assertions were passing by reading the machine's REAL credential and one could
          # not pass at all. Two lanes, or the guarantee is fiction.
          echo "uname: $(uname -s)"
          bash hooks/claude-identity/test-identity-cycle.sh

      - name: The suite REFUSES to run without the keychain override (safety gate)
        shell: bash
        run: |
          set -e
          # The gate is the reason this suite is safe to run on a maintainer's own Mac.
          # Assert it actually fires, rather than trusting that it is present: strip the
          # override from a COPY and require exit 2.
          cp -r hooks /tmp/nogate
          sed -i.bak 's/^KEYCHAIN_SERVICE=.*/KEYCHAIN_SERVICE="Claude Code-credentials"/' \
            /tmp/nogate/claude-identity/claude-identity.sh
          if bash /tmp/nogate/claude-identity/test-identity-cycle.sh >/dev/null 2>&1; then
            echo "::error::The suite RAN against a script with no AIOS_KEYCHAIN_SERVICE override. On macOS that writes to the operator's real credential."
            exit 1
          fi
          echo "OK: the suite refuses to run when its isolation is not in effect"

  primitives:
    name: Commit primitives
    # Canonical-contract check: skipped when this repo is a FORK used as an operator vault.
    # A fork keeps .github/ frozen (Tier 0 never syncs), so its OLD workflow judges NEW
    # content /aios:update legitimately delivered — red mail for healthy files, and pulling
    # the new workflow by hand only moves the error. For a contributor PR this still RUNS:
    # pull_request events evaluate github.event.repository against the BASE repo, not the fork.
    if: github.event.repository.fork != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: aios-commit / aios-note-append / secret-scan regression test
        run: bash tests/aios-commit.test.sh

      - name: install-wrappers detect_primary_session regression test
        # The name this returns is written into the operator's shell rc, so a wrong answer
        # silently redefines a function they type daily. Two shipped incidents (a globbing
        # `*buddy*`, then a lowercase-only validator renaming `ALI()` → `aios()`) — both
        # reported by operators, neither catchable here because nothing tested this file.
        run: bash tests/install-wrappers.test.sh

      - name: rotation threshold reaches its enforcing process
        # THRESHOLD_5H/7D lived in claude-identity.sh and nothing read them: never
        # exported, no consumer in that file, and the hot path (statusLine ->
        # _cache.py -> _watch.py) never sources the shell. Editing the value you
        # could find changed nothing, silently. Reported from a Linux operator's
        # live rotation (#15).
        run: bash tests/quota-threshold.test.sh

      - name: rotation picks an account with actual capacity
        # Bare `switch` wraps, so with two accounts exhausting B rotates back to
        # a still-capped A — landing on a dead account and then burning the
        # cooldown there. Includes the non-obvious one: a `declined` row must not
        # arm the cooldown, or the watcher goes blind exactly when it must not.
        run: bash tests/quota-rotation-target.test.sh

      - name: watcher evaluation interval tightens near the cap
        # A flat 30s tick was the real ceiling: the credential swap lands in
        # milliseconds, but only if the threshold is EVALUATED in time. Parallel
        # subagents cross the cap inside a 30s blind window.
        run: bash tests/quota-tick-interval.test.sh

      - name: every component follows CLAUDE_CONFIG_DIR together
        # The safe way to add an account is to log it into an isolated config dir
        # and capture from there (`/login` revokes the previous refresh token).
        # If one component lags the relocation, every path still resolves and the
        # watcher reads one account's state while the operator works in another.
        run: bash tests/quota-config-dir.test.sh

      - name: credential backend round-trip and refusal
        # The Linux/Windows store is a plaintext file that this tool REPLACES on
        # every swap: a malformed blob would overwrite a working credential and
        # surface as a logged-out session, not as an error. Also asserts the
        # rename bumps mtime, which is the signal a live session rides to adopt.
        run: bash tests/credential-backend.test.sh

      - name: a rotation the live session never adopted is detected
        # The autopilot leans on Claude Code re-reading the credential store on
        # its next API request. That was measured, not promised — if an update
        # removed it the failure would be mute: swap succeeds, log says rotated,
        # session keeps burning the capped account. This is the only sensor.
        run: bash tests/adoption-detector.test.sh

      - name: every workflow expression names a real context
        # THE ONE CHECK THAT CANNOT SAVE ITSELF, kept here anyway for the case where the file is
        # still valid and a bad expression is added alongside. An INVALID expression produces
        # zero jobs, so this step would never execute to report it — which is why the suite's
        # real home is the local run loop, before the push. See the file header.
        run: bash tests/workflow-expressions.test.sh

      - name: the snapshot archiver survives concurrent writers
        # AI-102's whole point. The suite injects a realistic decide-to-write window into a
        # locked and an unlocked copy and races six writers through each: the unlocked control
        # must LOSE data, or the locked result proves nothing. A first version of that test had
        # no injected window, the control passed too, and it would have certified the lock on a
        # race that never occurred.
        run: bash tests/aios-snapshot.test.sh

      - name: the star ask decides correctly about whether to ask
        # Every defect this suite covers fails in the SILENT direction — the script still
        # exits 0 and still prints a verdict, just the wrong one. A missing tracker reading as
        # "not declined" re-asks someone who already said no; an unquoted reason= executes as
        # a command in the eval its own caller docs prescribe. Nothing about "does it run"
        # sees either. The suite is local-only by design (no authenticated gh in CI): every
        # decision about WHETHER to ask is local, and that is exactly what it asserts.
        run: bash tests/star-check.test.sh

  primitives_bash32:
    # Canonical-contract check: skipped when this repo is a FORK used as an operator vault.
    # A fork keeps .github/ frozen (Tier 0 never syncs), so its OLD workflow judges NEW
    # content /aios:update legitimately delivered — red mail for healthy files, and pulling
    # the new workflow by hand only moves the error. For a contributor PR this still RUNS:
    # pull_request events evaluate github.event.repository against the BASE repo, not the fork.
    if: github.event.repository.fork != true
    # The same regression suite under bash 3.2 — the bash Apple ships at /bin/bash on every
    # macOS, and what `#!/usr/bin/env bash` resolves to on a stock Mac. The `primitives` job
    # above runs on ubuntu (bash 5), where `"${arr[@]}"` on an empty array is harmless — so it
    # structurally could NOT catch #6 (empty-array expansion aborting under `set -u`). Neither
    # could any maintainer whose PATH has Homebrew bash first. This lane is the one that can.
    name: Commit primitives (bash 3.2 — macOS system bash)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pin `bash` on PATH to the 3.2 system bash
        # Load-bearing: the hooks under test carry `#!/usr/bin/env bash`, so without this the
        # runner's Homebrew bash 5 would service them and the lane would silently prove nothing.
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/bash32"
          ln -sf /bin/bash "$RUNNER_TEMP/bash32/bash"
          echo "$RUNNER_TEMP/bash32" >> "$GITHUB_PATH"

      - name: Confirm the toolchain really is 3.2
        run: |
          set -e
          echo "/bin/bash    → $(/bin/bash --version | head -1)"
          echo "env bash     → $(env bash --version | head -1)"
          env bash -c '[ "${BASH_VERSINFO[0]}" -eq 3 ]' || {
            echo "::error::Expected bash 3.x on PATH for this lane — the guard would be vacuous otherwise."
            exit 1
          }

      - name: Regression suite under bash 3.2
        run: /bin/bash tests/aios-commit.test.sh

      - name: install-wrappers regression under bash 3.2
        # The installer writes to a *stock* Mac's shell rc, which is exactly where 3.2 lives.
        run: /bin/bash tests/install-wrappers.test.sh

      - name: rotation threshold under bash 3.2
        # macOS is the platform the rotation autopilot already supports, so this
        # lane is the one that matters most for it.
        run: /bin/bash tests/quota-threshold.test.sh

  primitives_windows:
    # Canonical-contract check: skipped when this repo is a FORK used as an operator vault.
    # A fork keeps .github/ frozen (Tier 0 never syncs), so its OLD workflow judges NEW
    # content /aios:update legitimately delivered — red mail for healthy files, and pulling
    # the new workflow by hand only moves the error. For a contributor PR this still RUNS:
    # pull_request events evaluate github.event.repository against the BASE repo, not the fork.
    if: github.event.repository.fork != true
    # The same regression suite under GIT BASH — the shell Windows operators actually run
    # `aios-commit` in. The windows_installer lane below covers only the PowerShell installer,
    # so until this lane existed NOTHING had ever executed the commit primitives on Windows:
    # ubuntu proves POSIX, macOS proves bash 3.2, and neither can see an MSYS-specific fault.
    # `shell: bash` on windows-latest resolves to Git for Windows' bash — the operator's real
    # shell, not a POSIX emulator picked for CI convenience.
    name: Commit primitives (Windows / Git Bash)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Confirm the lane really is Git Bash (else it proves nothing)
        # Mirrors the bash-3.2 lane's toolchain guard. If `shell: bash` ever resolved to WSL or
        # a bundled POSIX shell instead of MSYS, every assertion below would still pass while
        # testing a platform no operator uses — green, and vacuous.
        shell: bash
        run: |
          set -e
          echo "uname -s → $(uname -s)"
          echo "bash     → $(bash --version | head -1)"
          case "$(uname -s)" in
            MINGW*|MSYS*) : ;;
            *) echo "::error::Expected MINGW/MSYS (Git Bash) on windows-latest — got '$(uname -s)'. This lane would be vacuous."; exit 1 ;;
          esac

      - name: Line endings survived checkout (the fault this lane was built to catch)
        # Git for Windows defaults to core.autocrlf=true, which rewrites LF -> CRLF on checkout.
        # For a shell script that is fatal, not cosmetic: Git Bash reads `#!/usr/bin/env bash\r`
        # and dies with `bad interpreter`. `.gitattributes` pins these paths to eol=lf; this step
        # MEASURES that rather than trusting it, because the failure is silent until execution and
        # it hits real Windows operators who cloned the repo, not just CI.
        shell: bash
        run: |
          set -e
          echo "core.autocrlf → $(git config --get core.autocrlf || echo '(unset)')"
          rc=0
          for f in hooks/aios-commit hooks/aios-note-append hooks/git/secret-scan.sh tests/aios-commit.test.sh; do
            if grep -qU $'\r' "$f"; then echo "::error::$f contains CR after checkout — Git Bash cannot execute it. Check .gitattributes."; rc=1
            else echo "  ok (LF): $f"; fi
          done
          exit $rc

      - name: Regression suite under Git Bash
        shell: bash
        run: bash tests/aios-commit.test.sh

  windows_installer:
    # Canonical-contract check: skipped when this repo is a FORK used as an operator vault.
    # A fork keeps .github/ frozen (Tier 0 never syncs), so its OLD workflow judges NEW
    # content /aios:update legitimately delivered — red mail for healthy files, and pulling
    # the new workflow by hand only moves the error. For a contributor PR this still RUNS:
    # pull_request events evaluate github.event.repository against the BASE repo, not the fork.
    if: github.event.repository.fork != true
    # The Windows installer had NO execution lane. `install-wrappers.ps1` shipped
    # twice on regex-inspection alone ("regex-verified against the same case matrix
    # but not execution-verified -- no PowerShell on the authoring machine"), and the
    # second time it shipped a file that Windows PowerShell 5.1 could not parse at all,
    # from an installer whose own verification reported four green checks. A content
    # check cannot catch that; only running it can.
    name: Windows wrapper installer (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Confirm the lane really is Windows PowerShell 5.1
        # Load-bearing: pwsh 7 assumes UTF-8 for BOM-less scripts and would decode
        # every file here correctly, making this lane prove nothing. 5.1 is the
        # edition a stock Windows 11 ships, and the only one that reproduces the bug.
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          if ($PSVersionTable.PSEdition -ne 'Desktop') {
            Write-Host "::error::Expected Windows PowerShell (Desktop edition) for this lane."
            exit 1
          }

      - name: The hazard is real (negative control)
        # Proves the ASCII-only rule below guards something real, so the check is not
        # decoration. The hazard is a CHAIN of two links, asserted separately so this
        # control never depends on the runner's environment matching the operator's:
        #   1. DECODE: UTF-8 bytes read under a legacy ANSI codepage yield mojibake
        #      whose third character is U+201D. Asserted against CP1252 EXPLICITLY
        #      rather than through whatever the runner's own ACP happens to be.
        #      windows-latest is ACP 1252 today, so the end-to-end path DOES
        #      reproduce here (see the note this step prints) -- but a runner moved
        #      to UTF-8 (65001) would decode correctly and silently stop exercising
        #      this link at all, with the lane still green.
        #   2. PARSE: PowerShell treats a curly quote as a string delimiter, so a
        #      script carrying one inside a string fails to parse.
        # If either link stops holding, the ASCII-only rule has gone vacuous and
        # should be revisited.
        shell: powershell
        run: |
          # Diagnostic, not an assertion: record what this runner actually decodes with.
          $acp = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Nls\CodePage' -Name ACP).ACP
          Write-Host "runner ANSI codepage (ACP): $acp   PSVersion: $($PSVersionTable.PSVersion)"

          # --- Link 1: UTF-8 em dash bytes, decoded as CP1252, yield U+201D ---
          # The bytes are written out literally. Do NOT use "`u{2014}" here: that
          # escape is PowerShell 6+ only, and under 5.1 it degrades to the literal
          # text "u{2014}", leaving the file pure ASCII. This control did exactly
          # that and so asserted nothing -- vacuous in the way it exists to prevent.
          $emdashUtf8 = [byte[]]@(0xE2, 0x80, 0x94)
          $mojibake = [System.Text.Encoding]::GetEncoding(1252).GetString($emdashUtf8)
          if ($mojibake.IndexOf([char]0x201D) -lt 0) {
            Write-Host "::error::UTF-8 em dash decoded as CP1252 no longer yields U+201D (got '$mojibake') -- the mojibake mechanism changed."
            exit 1
          }
          Write-Host "ok: UTF-8 em dash decoded as CP1252 -> '$mojibake' (contains U+201D)"

          # --- Link 2: a curly quote inside a string breaks the parser ---
          # Written WITH a BOM on purpose: this asserts the PARSER's treatment of the
          # character, not the decode, so the read must be faithful on any ACP.
          $f = Join-Path $env:RUNNER_TEMP 'curly.ps1'
          $utf8Bom = New-Object System.Text.UTF8Encoding($true)
          [System.IO.File]::WriteAllText($f, "Write-Host `"a $([char]0x201D) b`"`r`n", $utf8Bom)
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile($f, [ref]$null, [ref]$errs) | Out-Null
          if (-not $errs) {
            Write-Host "::error::A curly quote inside a string parsed cleanly -- PowerShell no longer treats it as a delimiter."
            exit 1
          }
          Write-Host "ok: curly quote inside a string fails to parse ($($errs.Count) error(s))"

          # --- Informational: does the end-to-end path reproduce on THIS runner? ---
          # Deliberately NOT asserted. On a UTF-8-ACP runner it will not, and that is
          # fine: links 1 and 2 already carry the proof for operators on a legacy ACP.
          $g = Join-Path $env:RUNNER_TEMP 'hazard.ps1'
          $pre = [System.Text.Encoding]::UTF8.GetBytes('Write-Host "a ')
          $post = [System.Text.Encoding]::UTF8.GetBytes(" b`"`r`n")
          [System.IO.File]::WriteAllBytes($g, ($pre + $emdashUtf8 + $post))
          $e2 = $null
          [System.Management.Automation.Language.Parser]::ParseFile($g, [ref]$null, [ref]$e2) | Out-Null
          if ($e2) { Write-Host "note: BOM-less em dash also fails end-to-end on this runner (ACP $acp)" }
          else     { Write-Host "note: BOM-less em dash parses on this runner (ACP $acp) -- expected when ACP is UTF-8; links 1+2 carry the proof" }

      - name: Every .ps1 is ASCII-only or carries a UTF-8 BOM
        # The rule install-wrappers.ps1 states in its own header and then stopped
        # obeying -- 11 em dashes crept in, because nothing enforced it.
        shell: powershell
        run: |
          $bad = @()
          Get-ChildItem -Recurse -Filter *.ps1 -File | ForEach-Object {
            $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
            $hasBom = $bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF
            $nonAscii = ($bytes | Where-Object { $_ -gt 0x7F }).Count
            if ($nonAscii -gt 0 -and -not $hasBom) {
              $bad += "$($_.FullName.Replace($PWD.Path + '\','')) ($nonAscii non-ASCII byte(s), no BOM)"
            }
          }
          if ($bad.Count -gt 0) {
            Write-Host "::error::BOM-less .ps1 files contain non-ASCII -- Windows PowerShell 5.1 will corrupt them at parse time:"
            $bad | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
          Write-Host "ok: no BOM-less .ps1 carries non-ASCII"

      - name: install-wrappers.ps1 produces a profile that PARSES
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\hooks\claude-identity\install-wrappers.ps1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Installer exited $LASTEXITCODE"
            exit 1
          }
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile($PROFILE, [ref]$null, [ref]$errs) | Out-Null
          if ($errs) {
            Write-Host "::error::Installer reported success but the profile does not parse:"
            $errs | ForEach-Object { Write-Host "  line $($_.Extent.StartLineNumber): $($_.Message)" }
            exit 1
          }
          Write-Host "ok: profile parses cleanly after install"

      - name: A real shell loads the profile and gets the functions
        # The parse check above reads the file; this one proves a NEW shell -- the
        # thing the operator actually opens -- ends up with the wrappers defined.
        shell: powershell
        run: |
          # Single quotes inside the probe on purpose: double quotes are stripped
          # by the command-line parser on the way into `powershell -Command`, which
          # turns the string list into bare tokens and fails with MissingArgument.
          $probe = "foreach (`$f in 'Invoke-ClaudeWithRespawn','spawn','spawn-kill') { if (-not (Get-Command `$f -ErrorAction SilentlyContinue)) { Write-Host ('MISSING ' + `$f); exit 1 } }; Write-Host 'ALL PRESENT'"
          $out = & powershell -NoLogo -Command $probe 2>&1 | Out-String
          Write-Host $out.Trim()
          if ($out -notmatch 'ALL PRESENT') {
            Write-Host "::error::A fresh Windows PowerShell did not get the wrapper functions from the profile."
            exit 1
          }

      - name: Re-running the installer is idempotent and still parses
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\hooks\claude-identity\install-wrappers.ps1
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Second run exited $LASTEXITCODE"; exit 1 }
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile($PROFILE, [ref]$null, [ref]$errs) | Out-Null
          if ($errs) {
            Write-Host "::error::Profile stopped parsing on the second install -- damage compounds across runs:"
            $errs | ForEach-Object { Write-Host "  line $($_.Extent.StartLineNumber): $($_.Message)" }
            exit 1
          }
          $n = (Select-String -Path $PROFILE -Pattern '^function spawn \{').Count
          if ($n -ne 1) { Write-Host "::error::Expected exactly 1 spawn definition after re-run, found $n"; exit 1 }
          Write-Host "ok: idempotent, still parses, exactly one spawn definition"

      - name: aios-star-check.ps1 parses and fails closed
        # SAME REASON THIS LANE EXISTS. aios-star-check.ps1 was authored on a machine with no
        # PowerShell at all -- the exact condition under which install-wrappers.ps1 shipped
        # twice broken on inspection alone. Reading a .ps1 carefully is not running it: a
        # `return` inside a ForEach-Object scriptblock returns from the BLOCK, so a detection
        # helper can look right and answer wrong on every machine. Execute it here or it is
        # unverified.
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\hooks\aios-star-check.ps1), [ref]$null, [ref]$errs) | Out-Null
          if ($errs) {
            Write-Host "::error::aios-star-check.ps1 does not parse under Windows PowerShell 5.1:"
            $errs | ForEach-Object { Write-Host "  line $($_.Extent.StartLineNumber): $($_.Message)" }
            exit 1
          }
          Write-Host "ok: parses under 5.1"

          # FAIL CLOSED is the rule the whole script rests on, so assert it rather than trust
          # it. A tracker that does not exist means a prior decline would be invisible, which
          # must yield 'unknown' -- never 'unstarred', which would re-ask someone who declined.
          $env:AIOS_TRACKER = Join-Path $env:TEMP 'does-not-exist-star.aios-update'
          $out = & .\hooks\aios-star-check.ps1 2>$null
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::verdict path must always exit 0, got $LASTEXITCODE"; exit 1 }
          if (($out -join ' ') -notmatch "verdict='unknown'") {
            Write-Host "::error::Missing tracker must yield verdict=unknown. Got: $($out -join ' | ')"
            exit 1
          }
          Write-Host "ok: missing tracker -> unknown, exit 0"

          # An automated context must never produce an ask, whatever the API would say.
          $env:AIOS_STAR_ASK = 'never'
          $out = & .\hooks\aios-star-check.ps1 2>$null
          if (($out -join ' ') -notmatch "verdict='unknown'") {
            Write-Host "::error::AIOS_STAR_ASK=never must yield unknown. Got: $($out -join ' | ')"
            exit 1
          }
          Remove-Item Env:\AIOS_STAR_ASK
          Write-Host "ok: AIOS_STAR_ASK=never -> unknown"

          # The decline round-trip, on a real tracker, asserting hash= is left alone.
          $t = Join-Path $env:TEMP 'star-tracker.aios-update'
          Set-Content -Path $t -Value @('repo=x','hash=abc123','synced=2026-01-01') -Encoding UTF8
          $env:AIOS_TRACKER = $t
          & .\hooks\aios-star-check.ps1 -Decline | Out-Null
          $c = Get-Content $t
          if (-not ($c | Where-Object { $_ -match '^star-ask=declined' })) {
            Write-Host "::error::-Decline did not record star-ask="; exit 1
          }
          if (-not ($c | Where-Object { $_ -eq 'hash=abc123' })) {
            Write-Host "::error::-Decline disturbed hash= -- /aios:update owns that field alone"; exit 1
          }
          $out = & .\hooks\aios-star-check.ps1 2>$null
          if (($out -join ' ') -notmatch "verdict='declined'") {
            Write-Host "::error::A recorded decline must yield verdict=declined. Got: $($out -join ' | ')"
            exit 1
          }
          Write-Host "ok: decline recorded, hash= untouched, verdict=declined thereafter"
